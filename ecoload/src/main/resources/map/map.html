<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Route</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
html,body{
    width:100%;height:100%;margin:0;padding:0;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;background:#eef1f5
}
#map{
    position:fixed;inset:0;width:100%;height:100%;
    background:#e9edf2;z-index:1
}
.top-bar{
    position:fixed;top:14px;left:14px;right:14px;min-height:64px;
    z-index:1000;display:flex;align-items:center;
    justify-content:space-between;padding:12px 18px;
    background:rgba(255,255,255,.96);border:1px solid rgba(20,35,60,.08);
    border-radius:16px;box-shadow:0 8px 28px rgba(20,35,60,.16);
    backdrop-filter:blur(8px)
}
.title-wrap{display:flex;align-items:center;gap:11px}
.title-icon{
    width:38px;height:38px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;background:#17233c;
    color:white;font-size:19px
}
.title{color:#17233c;font-size:20px;font-weight:700}
.subtitle{margin-top:2px;color:#7a8494;font-size:11px}
.status{
    display:flex;align-items:center;gap:7px;padding:9px 14px;
    color:#16884f;background:#e8f8ef;border-radius:22px;
    font-size:13px;font-weight:700
}
.status-dot{width:8px;height:8px;border-radius:50%;background:#18a45e}
.trip-card{
    position:fixed;left:20px;bottom:20px;width:360px;z-index:1000;
    padding:20px;background:rgba(255,255,255,.97);
    border:1px solid rgba(20,35,60,.08);border-radius:18px;
    box-shadow:0 10px 32px rgba(20,35,60,.20)
}
.trip-title{color:#17233c;font-size:18px;font-weight:700;margin-bottom:17px}
.location{display:flex;align-items:center;gap:12px;margin:12px 0}
.location-marker{width:16px;height:16px;flex:0 0 16px;border-radius:50%}
.location-marker.pickup{background:#18a45e;box-shadow:0 0 0 5px rgba(24,164,94,.12)}
.location-marker.destination{background:#e53935;box-shadow:0 0 0 5px rgba(229,57,53,.12)}
.location-label{color:#89919d;font-size:10px;font-weight:700;letter-spacing:.5px}
.location-value{margin-top:2px;color:#17233c;font-size:14px;font-weight:700}
.divider{height:1px;margin:17px 0 14px;background:#e8ebef}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center}
.stat-label{color:#8a929e;font-size:10px;font-weight:700}
.stat-value{margin-top:4px;color:#17233c;font-size:15px;font-weight:700}
.loading-card{
    position:fixed;top:92px;left:50%;transform:translateX(-50%);
    z-index:1001;display:flex;align-items:center;gap:9px;
    padding:9px 14px;color:#17233c;background:rgba(255,255,255,.95);
    border-radius:20px;box-shadow:0 5px 18px rgba(20,35,60,.15);
    font-size:12px;font-weight:600;transition:opacity .2s ease
}
.loading-card.hidden{opacity:0;pointer-events:none}
.spinner{
    width:14px;height:14px;border:2px solid #dce3eb;
    border-top-color:#1976d2;border-radius:50%;
    animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.leaflet-control-zoom{
    border:none!important;
    box-shadow:0 5px 18px rgba(20,35,60,.18)!important
}
.leaflet-control-zoom a{
    color:#17233c!important;background:white!important;border:none!important
}
.leaflet-control-scale-line{
    border:2px solid #17233c!important;border-top:none!important;
    background:rgba(255,255,255,.8)!important;color:#17233c!important
}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:13px 15px;font-size:13px;line-height:1.5}
@media(max-width:700px){
    .trip-card{left:12px;right:12px;bottom:12px;width:auto}
    .top-bar{left:10px;right:10px;top:10px}
    .subtitle{display:none}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="top-bar">
    <div class="title-wrap">
        <div class="title-icon">🗺</div>
        <div>
            <div class="title">Trip Route</div>
            <div class="subtitle">Goods transporter route</div>
        </div>
    </div>
    <div class="status">
        <span class="status-dot"></span>
        Route Active
    </div>
</div>

<div id="loadingCard" class="loading-card">
    <div class="spinner"></div>
    <span id="loadingText">Loading route...</span>
</div>

<div class="trip-card">
    <div class="trip-title">Electronics Shipment</div>

    <div class="location">
        <div class="location-marker pickup"></div>
        <div>
            <div class="location-label">PICKUP</div>
            <div class="location-value">Pune, Maharashtra</div>
        </div>
    </div>

    <div class="location">
        <div class="location-marker destination"></div>
        <div>
            <div class="location-label">DESTINATION</div>
            <div class="location-value">Nashik, Maharashtra</div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">DISTANCE</div>
            <div id="distance" class="stat-value">--</div>
        </div>
        <div class="stat">
            <div class="stat-label">ETA</div>
            <div id="eta" class="stat-value">--</div>
        </div>
        <div class="stat">
            <div class="stat-label">ROUTE</div>
            <div id="routeStatus" class="stat-value">Loading</div>
        </div>
    </div>
</div>

<script>
let map=null;
let tileLayer=null;
let pickupMarker=null;
let destinationMarker=null;
let routeBase=null;
let routeLine=null;
let mapReady=false;

function createTileLayer(){
    return L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        {
            subdomains:'abcd',
            maxZoom:20,
            minZoom:3,
            tileSize:256,
            detectRetina:false,
            keepBuffer:2,
            updateWhenIdle:true,
            updateWhenZooming:false,
            attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
        }
    );
}

function initializeMap(){
    map=L.map('map',{
        zoomControl:true,
        preferCanvas:true,
        zoomAnimation:false,
        fadeAnimation:false,
        markerZoomAnimation:false
    });

    tileLayer=createTileLayer();
    tileLayer.addTo(map);

    tileLayer.on('tileerror',function(event){
        console.warn('Map tile failed:',event.tile?.src||'unknown tile');
    });

    L.control.scale({imperial:false,metric:true}).addTo(map);

    map.setView([19.1,73.8],7);
    mapReady=true;
    scheduleMapRefresh();
}

function refreshMap(){
    if(!map)return;
    map.invalidateSize({animate:false,pan:false});
    if(tileLayer)tileLayer.redraw();
}

function scheduleMapRefresh(){
    refreshMap();
    setTimeout(refreshMap,150);
    setTimeout(refreshMap,400);
    setTimeout(refreshMap,800);
    setTimeout(refreshMap,1400);
    setTimeout(refreshMap,2200);
}

function createMarkerIcon(background,symbol){
    return L.divIcon({
        className:'',
        html:
            '<div style="' +
            'width:44px;height:44px;border-radius:50%;' +
            'background:'+background+';border:4px solid white;' +
            'box-shadow:0 4px 14px rgba(0,0,0,.28);' +
            'display:flex;align-items:center;justify-content:center;' +
            'font-size:20px;">'+symbol+'</div>',
        iconSize:[44,44],
        iconAnchor:[22,22],
        popupAnchor:[0,-22]
    });
}

function setLoading(visible,message){
    const card=document.getElementById('loadingCard');
    const text=document.getElementById('loadingText');
    if(message)text.innerText=message;
    if(visible)card.classList.remove('hidden');
    else card.classList.add('hidden');
}

function clearRoute(){
    if(!map)return;
    if(pickupMarker){map.removeLayer(pickupMarker);pickupMarker=null;}
    if(destinationMarker){map.removeLayer(destinationMarker);destinationMarker=null;}
    if(routeBase){map.removeLayer(routeBase);routeBase=null;}
    if(routeLine){map.removeLayer(routeLine);routeLine=null;}
}

/*
 * Compatible with your current MapView.java:
 * showRoute(pickupLat,pickupLng,destinationLat,destinationLng)
 */
async function showRoute(pickupLat,pickupLng,destinationLat,destinationLng){

    if(!mapReady){
        console.error('Map is not ready.');
        return;
    }

    const values=[pickupLat,pickupLng,destinationLat,destinationLng];

    if(values.some(v=>!Number.isFinite(Number(v)))){
        console.error('Invalid route coordinates:',values);
        return;
    }

    pickupLat=Number(pickupLat);
    pickupLng=Number(pickupLng);
    destinationLat=Number(destinationLat);
    destinationLng=Number(destinationLng);

    setLoading(true,'Calculating road route...');
    document.getElementById('routeStatus').innerText='Loading';

    clearRoute();
    refreshMap();

    pickupMarker=L.marker(
        [pickupLat,pickupLng],
        {icon:createMarkerIcon('#18a45e','📦')}
    )
    .addTo(map)
    .bindPopup('<strong>Pickup Location</strong><br>Pune, Maharashtra');

    destinationMarker=L.marker(
        [destinationLat,destinationLng],
        {icon:createMarkerIcon('#e53935','📍')}
    )
    .addTo(map)
    .bindPopup('<strong>Destination</strong><br>Nashik, Maharashtra');

    const routeUrl=
        'https://router.project-osrm.org/route/v1/driving/' +
        pickupLng+','+pickupLat+';'+
        destinationLng+','+destinationLat+
        '?overview=full&geometries=geojson';

    try{
        const response=await fetch(routeUrl,{method:'GET',cache:'no-store'});

        if(!response.ok){
            throw new Error('Routing HTTP '+response.status);
        }

        const data=await response.json();

        if(data.code!=='Ok'||!data.routes||data.routes.length===0){
            throw new Error(data.message||'No road route found.');
        }

        const route=data.routes[0];

        const coordinates=route.geometry.coordinates.map(
            point=>[point[1],point[0]]
        );

        routeBase=L.polyline(coordinates,{
            color:'#ffffff',
            weight:11,
            opacity:.92,
            lineJoin:'round',
            lineCap:'round'
        }).addTo(map);

        routeLine=L.polyline(coordinates,{
            color:'#1976d2',
            weight:6,
            opacity:.95,
            lineJoin:'round',
            lineCap:'round'
        }).addTo(map);

        routeBase.bringToFront();
        routeLine.bringToFront();

        setTimeout(function(){
            refreshMap();

            map.fitBounds(routeLine.getBounds(),{
                paddingTopLeft:[70,100],
                paddingBottomRight:[70,100],
                maxZoom:11,
                animate:false
            });

            refreshMap();
            setTimeout(refreshMap,400);
        },250);

        const distanceKm=Number(route.distance)/1000;
        document.getElementById('distance').innerText=
            distanceKm.toFixed(1)+' km';

        const totalMinutes=Math.round(Number(route.duration)/60);
        const hours=Math.floor(totalMinutes/60);
        const minutes=totalMinutes%60;

        document.getElementById('eta').innerText=
            hours>0 ? hours+'h '+minutes+'m' : minutes+' min';

        document.getElementById('routeStatus').innerText='Active';
        setLoading(false);

    }catch(error){
        console.error('Route error:',error);
        document.getElementById('distance').innerText='--';
        document.getElementById('eta').innerText='--';
        document.getElementById('routeStatus').innerText='Error';
        setLoading(true,'Unable to load route');
    }
}

window.addEventListener('resize',scheduleMapRefresh);
window.addEventListener('load',scheduleMapRefresh);

initializeMap();
</script>
</body>
</html>
